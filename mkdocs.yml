site_name: 褚文浩
site_description: 褚文浩的个人学术主页，研究方向包括多模态模型、视觉语言模型与计算机视觉。
site_url: https://haogebob.github.io/
remote_branch: gh-pages

theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: white
    accent: grey
  features:
    - navigation.tabs
    - navigation.top
    - toc.follow

nav:
  - 主页: index.md
  - 算法简历: resume/index.html
  - 研究与项目:
      - 研究与项目: course/index.md
      - 写作示例: course/example.md
  - 相关链接: friends/index.md
  - 关于我: about/index.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
